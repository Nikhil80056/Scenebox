<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Later | SceneBox</title>
  <meta name="description" content="Review your saved moments and watch later queue on SceneBox.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Universal Navbar -->
  <header class="main-navbar" id="main-navbar"></header>

  <main class="container" style="padding-top: 2.5rem; padding-bottom: 4rem;">

    <div class="section-header" style="align-items: center;">
      <div>
        <h1 class="section-title" style="font-size: 2.25rem;">
          <span>🔖</span> Watch Later
        </h1>
        <p class="section-subtitle">Moments you've earmarked for your next viewing break.</p>
      </div>

      <div style="display: flex; align-items: center; gap: 1rem;">
        <span class="category-pill" id="watch-later-count-badge">0 scenes saved</span>
        <button class="btn btn-secondary btn-sm" id="btn-clear-watch-later" style="display: none;">
          Clear All
        </button>
      </div>
    </div>

    <!-- Content Container -->
    <div id="watch-later-content">
      <div class="scenes-grid" id="watch-later-grid"></div>
    </div>

  </main>

  <!-- Universal Footer -->
  <footer class="main-footer" id="main-footer"></footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/user.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      UserManager.initWatchLater();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Playlists | SceneBox</title>
  <meta name="description" content="Create and curate custom playlists of iconic fights, dialogues, and plot twists on SceneBox.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Universal Navbar -->
  <header class="main-navbar" id="main-navbar"></header>

  <main class="container" style="padding-top: 2.5rem; padding-bottom: 4rem;" id="playlists-main-container">

    <div class="section-header" style="align-items: center;">
      <div>
        <h1 class="section-title" style="font-size: 2.25rem;">
          <span>📋</span> My Playlists
        </h1>
        <p class="section-subtitle">Curated collections of the best fights, emotional dialogues, and plot twists.</p>
      </div>

      <button class="btn btn-primary" id="btn-open-create-playlist">
        <span>+</span> Create Playlist
      </button>
    </div>

    <!-- Playlists Grid View -->
    <div class="playlists-grid" id="playlists-grid"></div>

    <!-- Playlist Detail View (shown when inspecting a specific playlist) -->
    <div id="playlist-detail-container" style="display: none;"></div>

  </main>

  <!-- Universal Footer -->
  <footer class="main-footer" id="main-footer"></footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/playlists.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      PlaylistManager.init();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Scene | SceneBox</title>
  <meta name="description" content="Stream high-definition cinema moments, analyze Scene DNA characteristics, and discover related scenes.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Universal Navbar -->
  <header class="main-navbar" id="main-navbar"></header>

  <main class="container player-layout" id="player-container">

    <!-- Video Player Container -->
    <div id="video-player-container"></div>

    <!-- Scene Details & DNA Side-by-Side -->
    <div class="scene-player-details">
      <!-- Left: Metadata, Actions & Description -->
      <div id="scene-metadata-container"></div>

      <!-- Right: Scene DNA Visualization Card -->
      <div id="scene-dna-container"></div>
    </div>

    <!-- More Scenes from this Movie / Universe -->
    <section class="section" style="padding-top: 3rem; padding-bottom: 2rem;">
      <div class="section-header">
        <div>
          <h2 class="section-title">
            <span>🎬</span> More Scenes From This Movie
          </h2>
          <p class="section-subtitle">Other iconic highlights from the same title or genre universe.</p>
        </div>
      </div>
      <div class="scenes-grid" id="more-from-movie-grid"></div>
    </section>

    <!-- You May Also Like -->
    <section class="section" style="padding-top: 1rem; padding-bottom: 3rem;">
      <div class="section-header">
        <div>
          <h2 class="section-title">
            <span>✨</span> You May Also Like
          </h2>
          <p class="section-subtitle">Scenes sharing matching tags, intensity, and emotional resonance.</p>
        </div>
      </div>
      <div class="scenes-grid" id="you-may-also-like-grid"></div>
    </section>

  </main>

  <!-- Universal Footer -->
  <footer class="main-footer" id="main-footer"></footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/activity.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/player.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Player.init();
    });
  </script>
</body>
</html>
